name: Update Macro Data

on:
  # Run on the 5th of every month at 06:00 UTC
  schedule:
    - cron: '0 6 5 * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch macro data
        run: python scripts/fetch_macro.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet hulbert_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hulbert_data.json
          git commit -m "Auto-update macro data — $(date '+%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "hulbert_data.json is already up to date — no commit needed."
