name: Update Macro Data

on:
  schedule:
    # Dia 5 de cada mês, às 08:00 UTC
    - cron: '0 8 5 * *'
  workflow_dispatch: {}  # permite correr manualmente a partir do separador Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch_macro.py
        run: python scripts/fetch_macro.py

      - name: Commit updated hulbert_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hulbert_data.json
          git diff --staged --quiet || git commit -m "Auto-update macro data ($(date +%Y-%m-%d))"
          git push
